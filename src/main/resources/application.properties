# NOTE: swapped to embedded H2 for this session (candidate has no Docker/local MySQL
# available due to hardware constraints). MySQL-compatibility mode keeps JPA/SQL
# semantics close to the original. To restore real MySQL, revert to:
#   spring.datasource.url=jdbc:mysql://localhost:3306/telecomdb
#   spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:h2:mem:telecomdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
